name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle --no-daemon assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk AndroidAdBlock.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AndroidAdBlock
          path: AndroidAdBlock.apk
      # Publishes the APK at a fixed "latest" release so it can be
      # downloaded straight to a phone from the repo's Releases page.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          files: AndroidAdBlock.apk
