plugins {
    id 'com.android.application'
}

android {
    namespace 'app.androidadblock'
    compileSdk 34

    defaultConfig {
        applicationId 'app.androidadblock'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // A keystore committed to the repo so every CI build has the same
    // signature and installs over the previous one without uninstalling.
    signingConfigs {
        shared {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
